name: Generate and Commit API Docs

on:
  push:
    paths:
      - 'specs/**/*.yml'  # Trigger workflow on changes to any .yml file in the specs folder
  workflow_dispatch:  # Allow manual triggering of the workflow

permissions:
  contents: write  # Allow writing to the repository

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install CLI tools
        run: |
          npm install -g redoc-cli
          npm install -g @asyncapi/html-template

      - name: Generate HTML documentation for OpenAPI specs
        run: |
          for file in specs/openapi/**/*.yml; do
            filename=$(basename "$file" .yml)
            redoc-cli bundle "$file" -o "docs/${filename}-openapi.html"
          done

      - name: Generate HTML documentation for AsyncAPI specs
        run: |
          for file in specs/asyncapi/**/*.yml; do
            filename=$(basename "$file" .yml)
            asyncapi generate "$file" @asyncapi/html-template -o "docs/${filename}-asyncapi.html"
          done

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.html
          git commit -m "Update API documentation [skip ci]" || echo "No changes to commit"
          git push
