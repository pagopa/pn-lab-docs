openapi: 3.0.3
info:
  title: Servizio Standard ERDS - Relay Interface (PDND)
  x-summary: API REST per l'inoltro (relay) sicuro dei messaggi ERDS conforme a ETSI EN 319 522-2.
  description: |
    Specifica standard per il servizio di RelayMessage tra provider ERDS (Electronic Registered Delivery Services) 
    conforme a ETSI EN 319 522-2, erogato tramite la Piattaforma Digitale Nazionale Dati (PDND).
    Questa API deve essere implementata da ciascun ERDS per permettere l'inoltro (relay) sicuro 
    di costrutti 'ERD dispatch' nel modello a 4 angoli.
  version: 1.0.0
  contact:
    name: Supporto API ERDS
    url: https://example-erds.it/support
    email: support@example-erds.it

servers:
  - url: https://{erds-domain}/pdnd/erds/v1
    description: Endpoint standard esposto dal singolo ERDS Erogatore
    variables:
      erds-domain:
        default: api.example-erds.it
        description: Dominio dell'ERDS che eroga l'e-service.

tags:
  - name: Relay Interface
    description: Operazioni relative all'inoltro (relay) dei messaggi tra sistemi ERDS.
  - name: Health
    description: Endpoint per il monitoraggio dello stato dell'API.

paths:
  /status:
    get:
      summary: API health-check
      operationId: healthCheck
      description: Endpoint utilizzato dai sistemi di monitoraggio per verificare lo stato di salute del servizio.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Servizio attivo e funzionante.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    maxLength: 50
                    example: "UP"
        '503':
          description: Servizio non disponibile.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /relay:
    post:
      summary: Inoltra un messaggio ERD (Relay) tramite PDND
      operationId: relayMessagePDND
      description: |
        Riceve un costrutto 'ERD dispatch' (contenuto, metadati ed evidenze) dal S-ERDS (Fruitore) 
        per consegnarlo al R-ERDS (Erogatore). L'accesso è autorizzato tramite Voucher PDND.
      tags:
        - Relay Interface
      security:
        - pdndBearerAuth: []
      parameters:
        - in: header
          name: X-Correlation-ID
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
          description: Identificativo univoco della transazione per il tracciamento distribuito.
      requestBody:
        description: Payload ERD dispatch scambiato direttamente tra gli enti (non transita in PDND).
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ERDDispatch'
      responses:
        '200':
          description: Relay accettato con successo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayResponse'
        '400':
          description: Errore di validazione del payload (es. Digest errato o firma mancante).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Non autorizzato - Voucher PDND mancante o invalido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Accesso negato - Il fruitore non è autorizzato ad accedere all'e-service.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Errore interno dell'ERDS ricevente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    pdndBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT (Voucher) rilasciato dalla Piattaforma Digitale Nazionale Dati (PDND). 
        Il token è nel formato JWS ed è conforme alle specifiche e raccomandazioni di sicurezza incluse nella RFC8725.

  # --------------------------------------------------------------------------
  # PROFILING DECISIONS & COMPLIANCE METADATA
  # --------------------------------------------------------------------------
  x-profile-compliance:
    etsi-version: 'EN 319 522-2 V1.2.1'
    profile-name: 'ERDS Relay Interface (PDND) — HTTP/JSON Profile'
    profile-date: '2026-05-07'
    
  x-profile-decisions:
    B1-Identifier-Structure-Resolution:
      decision-id: 'B1'
      severity: 'BLOCKING'
      status: 'RESOLVED'
      etsi-requirement: 'EN319522-2:5.2'
      requirement-text: 'Identifiers shall consist of a scheme name and a value, and shall be unique within the interoperating ERDS network.'
      decision-date: '2026-05-07'
      affected-fields:
        - 'RelayMetadata.SenderId (MD08)'
        - 'RelayMetadata.RecipientId (MD10)'
        - 'UserDetails.Identifier (I01/I05)'
      solution: 'SERCQ Addressing Scheme with ISO 7064 Mod 97-10 Checksum'
      description: |
        Mandatory sender and recipient identifiers now use the SERCQ scheme format:
        Format: SERCQ:[NationalCode(ISO3166-1:2)]-[NationalIdentifier(country-defined)]-[Checksum(2)]
        Examples: 
          - SERCQ:IT-08976543-INIXX-8J (Italy: ANPR + registry code + checksum)
          - SERCQ:DE-12345678-DFVW-2K (Germany: country-specific format + checksum)
      uniqueness-model: 'Multi-layer scoping by country (ISO 3166-1:2) + country-defined NationalIdentifier + checksum'
      validation-pattern: '^SERCQ:[A-Z]{2}-[A-Za-z0-9\-]+-[A-Z0-9]{2}$'
      uri-representation: 'https://serviceUrl/SERCQ:IT-08976543-INIXX-8J'
      country-specific-note: 'Each country defines its own NationalIdentifier structure. Italy uses ANPR-RegistryCode format. Other countries may use different schemes.'
      
      # ========================================================================
      # CHECKSUM ALGORITHM SPECIFICATION
      # ========================================================================
      checksum-algorithm:
        standard: 'ISO 7064 Mod 97-10'
        reference: 'EN 13616 (IBAN Standard), ISO 7064:1983'
        status: 'SELECTED'
        purpose: 'Detect transcription errors (single-digit substitution, adjacent transposition)'
        
        specification:
          input: 'Value portion without SERCQ: prefix (e.g., "IT-08976543-INIXX")'
          output: '2-character alphanumeric checksum (0-9, A-Z)'
          algorithm: |
            1. Extract value without scheme: "IT-08976543-INIXX"
            2. Numeric conversion (alphanumeric mapping):
               - Digits 0-9 map to 0-9
               - Letters A-Z map to 10-35
               Example: "IT" → "1829", "08976543" → "08976543", "INIXX" → "1813 1833"
            3. Concatenate without hyphens: "182908976543181318 33"
            4. Compute checksum: checksum = (98 - (value mod 97)) mod 97
               Result range: 0-96 (97 possible values)
            5. Convert to 2-character base36:
               - Map 0-9 to "0"-"9"
               - Map 10-35 to "A"-"Z"
            6. Append to identifier: "SERCQ:IT-08976543-INIXX-[2-CHAR-CHECKSUM]"
          
          error-detection:
            single-digit-substitution: '100% detection'
            adjacent-transposition: '~98% detection'
            random-errors: '~97% detection'
          
          validation-procedure: |
            Receiver validation:
            1. Extract checksum from identifier (last 2 characters)
            2. Remove checksum and recompute using same algorithm
            3. Compare received vs. computed checksum
            4. Reject if mismatch (transmission/transcription error detected)
          
          implementation-notes: |
            - Deterministic: identical input always produces identical checksum
            - Country-agnostic: works with any NationalIdentifier format
            - Widely supported: ISO 7064 libraries available in major languages
            - ETSI-aligned: matches financial/postal identifier standards
        
        test-vectors:
          - identifier: 'SERCQ:IT-08976543-INIXX'
            checksum: '8J'
            full: 'SERCQ:IT-08976543-INIXX-8J'
          - identifier: 'SERCQ:IT-12345678-ABBXX'
            checksum: 'X4'
            full: 'SERCQ:IT-12345678-ABBXX-X4'
          - identifier: 'SERCQ:DE-87654321-DFVW'
            checksum: '2K'
            full: 'SERCQ:DE-87654321-DFVW-2K'
      
      outstanding-items:
        - 'ETSI scheme formality validation (with standards liaison)'
      
      next-steps: 'Standards review + implementation integration'
      owner: 'Director Review'

  schemas:
    # --------------------------------------------------------------------------
    # SCHEMA PROBLEM (RFC 7807)
    # --------------------------------------------------------------------------
    Problem:
      type: object
      additionalProperties: false
      description: Oggetto di errore standardizzato secondo RFC 7807 (Problem Details for HTTP APIs).
      properties:
        type:
          type: string
          format: uri
          maxLength: 255
        title:
          type: string
          maxLength: 255
          example: "Service Unavailable"
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 600
          example: 503
        detail:
          type: string
          maxLength: 1024
        instance:
          type: string
          format: uri
          maxLength: 255

    # --------------------------------------------------------------------------
    # STRUTTURA PRINCIPALE: ERD Dispatch
    # --------------------------------------------------------------------------
    ERDDispatch:
      type: object
      additionalProperties: false
      description: Costrutto ERD dispatch che raggruppa contenuto, metadati ed evidenze.
      required:
        - userContent
        - relayMetadata
        - evidence
      properties:
        userContent:
          $ref: '#/components/schemas/UserContent'
        relayMetadata:
          $ref: '#/components/schemas/RelayMetadata'
        evidence:
          type: array
          description: Insieme delle evidenze ERDS (almeno una presente nel costrutto dispatch).
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Evidence'

    # --------------------------------------------------------------------------
    # CONTENUTO UTENTE (User Content)
    # --------------------------------------------------------------------------
    UserContent:
      type: object
      additionalProperties: false
      description: Il contenuto reale del messaggio sottomesso dall'utente.
      required:
        - oggetto
        - testo
      properties:
        oggetto:
          type: string
          maxLength: 1024
        testo:
          type: string
          maxLength: 500000
        allegati:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/Attachment'

    Attachment:
      type: object
      additionalProperties: false
      required:
        - filename
        - contentType
        - content
      properties:
        filename:
          type: string
          maxLength: 255
        contentType:
          type: string
          maxLength: 100
        content:
          type: string
          format: byte
          maxLength: 104857600
          description: Contenuto binario codificato in Base64.

    # --------------------------------------------------------------------------
    # METADATI DI RELAY (MD01 - MD15)
    # --------------------------------------------------------------------------
    RelayMetadata:
      type: object
      additionalProperties: false
      required:
        - MetadataVersion
        - SenderId
        - RecipientId
        - ERDMessageType
        - UserContentInfo
      properties:
        MetadataVersion:
          type: string
          maxLength: 50
          description: MD01 - Versione dei metadati (es. EN319522v1.1.1).
        RelayDateAndTime:
          type: string
          format: date-time
          maxLength: 50
        SenderId:
          type: string
          format: sercq-identifier
          pattern: '^SERCQ:[A-Z]{2}-[A-Za-z0-9\-]+-[A-Z0-9]{2}$'
          maxLength: 255
          description: MD08 - Identificativo univoco del mittente originario (schema SERCQ conforme a EN319522-2:5.2). NationalIdentifier format è definito da ciascun paese.
          example: 'SERCQ:IT-08976543-INIXX-AA'
          x-etsi-reference: 'EN319522-2:5.2/MD08'
          x-etsi-requirement: 'Identifiers shall consist of a scheme name and a value, uniquely identifying sender across ERDS network.'
          x-profile-decision: 'B1-RESOLVED'
          x-profile-scheme: 'SERCQ'
          x-profile-value-format: 'SERCQ:[NationalCode(ISO3166-1:2)]-[NationalIdentifier(country-defined)]-[Checksum(2)]'
          x-profile-country-formats: 'Each country defines its own NationalIdentifier structure (e.g., IT: ANPR-RegistryCode)'
        RecipientId:
          type: string
          format: sercq-identifier
          pattern: '^SERCQ:[A-Z]{2}-[A-Za-z0-9\-]+-[A-Z0-9]{2}$'
          maxLength: 255
          description: MD10 - Identificativo univoco del destinatario finale (schema SERCQ conforme a EN319522-2:5.2). NationalIdentifier format è definito da ciascun paese.
          example: 'SERCQ:IT-08976543-ABBXX-AA'
          x-etsi-reference: 'EN319522-2:5.2/MD10'
          x-etsi-requirement: 'Identifiers shall consist of a scheme name and a value, uniquely identifying recipient across ERDS network.'
          x-profile-decision: 'B1-RESOLVED'
          x-profile-scheme: 'SERCQ'
          x-profile-value-format: 'SERCQ:[NationalCode(ISO3166-1:2)]-[NationalIdentifier(country-defined)]-[Checksum(2)]'
          x-profile-country-formats: 'Each country defines its own NationalIdentifier structure (e.g., IT: ANPR-RegistryCode)'
        MessageIdentifier:
          type: string
          maxLength: 255
          description: MD11 - Identificativo univoco del messaggio originale.
        ERDMessageType:
          type: string
          maxLength: 255
          description: MD13 - Tipo di messaggio (http://uri.etsi.org/19522/v1#/ERDMessageType/dispatch).
        UserContentInfo:
          $ref: '#/components/schemas/UserContentInfo'

    UserContentInfo:
      type: object
      additionalProperties: false
      description: MD14 / M02 - Dettaglio struttura contenuto per verifica integrità.
      required:
        - ComposingParts
        - PartsInfo
      properties:
        AppLayerIdentifier:
          type: string
          maxLength: 255
        ComposingParts:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        PartsInfo:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PartInfo'

    PartInfo:
      type: object
      additionalProperties: false
      required:
        - Identifier
        - ContentType
        - DigestMethod
        - DigestValue
      properties:
        Identifier:
          type: string
          maxLength: 255
        ContentType:
          type: string
          maxLength: 100
        DigestMethod:
          type: string
          format: uri
          maxLength: 255
        DigestValue:
          type: string
          format: byte
          maxLength: 512

    # --------------------------------------------------------------------------
    # EVIDENZE (Componenti G, R, I, M)
    # --------------------------------------------------------------------------
    Evidence:
      type: object
      additionalProperties: false
      required:
        - EvidenceIdentifier
        - EvidenceVersion
        - ERDSEventId
        - EventTime
        - EvidenceIssuerDetails
        - SenderDetails
        - RecipientDetails
        - UserContentInfo      # <-- AGGIUNTO (Componente M02 obbligatorio)
        - Signature
      properties:
        EvidenceIdentifier:
          type: string
          maxLength: 255
          description: G01 - ID univoco dell'evidenza.
        EvidenceVersion:
          type: string
          maxLength: 50
          description: G02 - Versione formato evidenza.
        ERDSEventId:
          $ref: '#/components/schemas/ERDSRelayEventId'
        EventReasons:
          type: array
          minItems: 1
          maxItems: 20
          description: G04 - Ragioni evento.
          items:
            $ref: '#/components/schemas/EventReason'
        EventTime:
          type: string
          format: date-time
          maxLength: 50
          description: G05 - Timestamp esatto dell'evento.
        EvidenceIssuerPolicyID:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 255
        EvidenceIssuerDetails:
          $ref: '#/components/schemas/EntityDetails'
        SenderDetails:
          $ref: '#/components/schemas/UserDetails'
        RecipientDetails:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/UserDetails'
        UserContentInfo:
          $ref: '#/components/schemas/UserContentInfo'
          description: M02 - Replica delle informazioni strutturali del contenuto (stesso formato di MD14). Sigillato dalla firma dell'evidenza.
        Signature:
          type: string
          maxLength: 20000
          description: R03 - Firma digitale dell'evidenza (Base64).

    ERDSRelayEventId:
      type: string
      format: uri
      maxLength: 255
      description: G03 - URI evento relay ETSI.
      enum:
        - http://uri.etsi.org/19522/Event/RelayAcceptance
        - http://uri.etsi.org/19522/Event/RelayRejection
        - http://uri.etsi.org/19522/Event/RelayFailure

    EventReasonCode:
      type: string
      description: Codice profilo della ragione evento relay.
      enum:
        - RB01
        - RB02
        - RB03
        - RB04
        - RB05
        - RB06
        - RB07
        - RB08
        - RB09
        - RB10
        - RB21
        - RB22
        - RBXX

    EventReasonUri:
      type: string
      format: uri
      maxLength: 255
      description: URI della ragione evento relay (ETSI canonica o profilo locale, es. caso RBXX).
      x-etsi-known-values:
        - http://uri.etsi.org/19522/EventReason/S_ERDS_MessageSuccessfullyRelayed
        - http://uri.etsi.org/19522/EventReason/R_ERDS_MessageRejected
        - http://uri.etsi.org/19522/EventReason/R_ERDS_MessageRejectedForMalware
        - http://uri.etsi.org/19522/EventReason/R_ERDS_MessageRejectedForInvalidSignature
        - http://uri.etsi.org/19522/EventReason/R_ERDS_MessageRejectedForInvalidCertificate
        - http://uri.etsi.org/19522/EventReason/R_ERDS_PolicyViolation
        - http://uri.etsi.org/19522/EventReason/R_ERDS_Malfunction
        - http://uri.etsi.org/19522/EventReason/R_ERDS_NotIdentified
        - http://uri.etsi.org/19522/EventReason/R_ERDS_Unreachable
        - http://uri.etsi.org/19522/EventReason/UnknownRecipient
        - http://uri.etsi.org/19522/EventReason/MessageNotAcceptedForUnregisteredRecipient
        - http://uri.etsi.org/19522/EventReason/S_ERDSP_ReceivedNoRelayAcceptanceInfoFromR_ERDSP
    
    EventReason:
      type: object
      additionalProperties: false
      required:
        - code
        - uri
      properties:
        code:
          $ref: '#/components/schemas/EventReasonCode'
        uri:
          $ref: '#/components/schemas/EventReasonUri'
        detail:
          type: string
          maxLength: 2048
      x-etsi-relay-reason-matrix:
        http://uri.etsi.org/19522/Event/RelayAcceptance:
          - RB01
        http://uri.etsi.org/19522/Event/RelayRejection:
          - RB02
          - RB03
          - RB04
          - RB05
          - RB06
          - RB21
        http://uri.etsi.org/19522/Event/RelayFailure:
          - RB07
          - RB08
          - RB09
          - RB10
          - RB22
          - RBXX

    # --------------------------------------------------------------------------
    # DETTAGLI UTENTI ED ENTITÀ (Conformi a ETSI EN 319 522-3)
    # --------------------------------------------------------------------------
    EntityDetails:
      type: object
      additionalProperties: false
      description: R02 - Dettagli provider emittente (EntityDetailsType).
      required:
        - Identity
      properties:
        Identity:
          type: array
          minItems: 1
          maxItems: 50
          description: Attributi di identità dell'entità.
          items:
            type: string
            maxLength: 1024
        CertificateDetails:
          type: string
          format: byte
          maxLength: 10000
          description: Dettagli del certificato X.509 in formato Base64.

    UserDetails:
      type: object
      additionalProperties: false
      description: I01/I05 - Attributi identità utente mittente/destinatario (UserDetailsType).
      properties:
        Identity:
          type: array
          minItems: 1
          maxItems: 50
          description: Attributi di identità dell'utente (es. attributi SAML).
          items:
            type: string
            maxLength: 1024
        Identifier:
          type: string
          format: sercq-identifier
          pattern: '^SERCQ:[A-Z]{2}-[A-Za-z0-9\-]+-[A-Z0-9]{2}$'
          maxLength: 255
          description: Identificatore univoco dell'utente mittente/destinatario (schema SERCQ conforme a EN319522-2:5.2). NationalIdentifier format è definito da ciascun paese.
          example: 'SERCQ:IT-08976543-INIXX-AA'
          x-etsi-reference: 'EN319522-2:5.2/MD08,MD10'
          x-etsi-requirement: 'User identifiers shall consist of a scheme name and a value within UserDetailsType.'
          x-profile-decision: 'B1-RESOLVED'
          x-profile-scheme: 'SERCQ'
          x-profile-value-format: 'SERCQ:[NationalCode(ISO3166-1:2)]-[NationalIdentifier(country-defined)]-[Checksum(2)]'
          x-profile-country-formats: 'Each country defines its own NationalIdentifier structure (e.g., IT: ANPR-RegistryCode)'
        AssuranceLevelsDetails:
          type: string
          maxLength: 2048
          description: Dettagli sui livelli di garanzia di identificazione/autenticazione.

    # --------------------------------------------------------------------------
    # RISPOSTE
    # --------------------------------------------------------------------------
    RelayResponse:
      type: object
      additionalProperties: false
      description: Schema per la risposta in caso di successo
      properties:
        status:
          type: string
          maxLength: 50
          example: "ACCEPTED"
        message:
          type: string
          maxLength: 1024
          example: "Il payload ERD dispatch è stato inoltrato e preso in carico con successo."